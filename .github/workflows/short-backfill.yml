name: short-backfill
# 공매도 과거 자료 받기(2026-11-18 추가, 같은 날 03:17·05:17 두 번으로 바꾸고 10년치 이어받기 추가)
# 하루 최대 여섯 번(1시간마다 깨워 겹침 확인이 고름 — GitHub 예약이 몇 시간씩 늦어 시각을 정할 수 없음). 대시보드 정시 갱신(08:23·15:43·20:23 KST) 앞뒤는 피함. 한 번에 최대 210번 조회(조회 사이 4~6초, 약 20분).
#  1) 2026-01-02 이후 빈 날짜(main 가지 data/short)
#  2) 1)이 다 채워졌고 문제(접속 제한·오류)가 없었으면 남은 조회 수로 2016~2025 10년치(short-history 가지 data/short, 최신 날짜부터)
#     — 10년치는 파일이 많아(약 130MB) 대시보드가 매번 받는 main 이 무거워지지 않게 따로 둔다.
# 막히면 바로 멈추고 24시간 쉬며(그동안 실행돼도 KRX 에 로그인하지 않음) 카카오톡으로 알린다. 다 받으면 조회 없이 끝난다.
on:
  schedule:
    # GitHub 예약이 이 저장소에서 5~8시간씩 늦게 돈다(11/19~22 확인: 11:17 예약이 18:50~19:20, 03:17 예약이 09:00~10:40 에 돎).
    # 그래서 시각을 고정하지 않고 1시간마다 깨워(빠지는 예약이 많아 2시간마다로는 하루 세 번 남짓만 돎 — 11/24 1시간마다로 바꿈), 겹침 확인 단계가 '90분 간격·24시간 여섯 번·대시보드 갱신 시간 피하기'로 실제 실행을 고른다.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      max_calls:
        description: '이번에 조회할 최대 횟수(날짜 하나 = 1번)'
        default: '210'
      force:
        description: 'true 면 90분 안에 돈 기록이 있어도 실행'
        default: 'false'
      mode:
        description: 'auto(2026 빈 날짜 → 10년치) · daily(최근 10거래일, 4c 단계와 같음) · history(10년치만, 시험용)'
        default: 'auto'
permissions:
  contents: write
concurrency:
  group: dashboard-update      # 대시보드 갱신과 같은 줄 — 동시에 KRX 에 로그인하거나 저장이 겹치지 않게 한다
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUDGET: ${{ github.event.inputs.max_calls || '210' }}
      MODE: ${{ github.event.inputs.mode || 'auto' }}
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: git 사용자
        run: git config --global user.name "dashboard-bot"; git config --global user.email "dashboard-bot@users.noreply.github.com"
      - name: 겹침 확인(90분 간격·하루 여섯 번·대시보드 갱신 시간 피하기)
        id: guard
        run: |
          # GitHub 예약이 빠지는 일이 있어(11/19 새벽 두 번 모두 안 돎) 03:47·05:47 예비 예약을 둔다.
          # 둘 다 돌면 같은 줄에서 차례로 실행되므로, 뒤에 온 것은 data/short/night.json 의 시각을 보고 건너뛴다.
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, datetime as dt
          now = dt.datetime.now(dt.timezone.utc)
          try: n = json.load(open('data/short/night.json'))
          except Exception: n = {}
          runs = [dt.datetime.fromisoformat(x) for x in n.get('runs', ([n['at']] if n.get('at') else []))]
          last = max(runs) if runs else None
          day = [x for x in runs if (now - x).total_seconds() < 24 * 3600]
          kst = now + dt.timedelta(hours=9); hm = kst.hour * 60 + kst.minute
          auto = os.environ['MODE'] == 'auto' and os.environ.get('FORCE') != 'true'
          why = ''
          if auto and last and (now - last).total_seconds() < 90 * 60: why = f'90분 안에 이미 돎({last:%m-%d %H:%M} UTC)'
          elif auto and len(day) >= 6: why = f'24시간 안에 이미 {len(day)}번 돎'
          # 대시보드 정시 갱신(08:23·15:43·20:23 KST, 평일) 앞뒤 — 갱신이 같은 줄에서 밀리지 않게
          elif os.environ.get('EVENT') == 'schedule' and kst.weekday() < 5 and any(a <= hm < b for a, b in [(8*60+5, 8*60+50), (15*60+25, 16*60+15), (20*60+5, 20*60+50)]):
              why = f'대시보드 갱신 시간(KST {kst:%H:%M})'
          print('skip=' + ('true' if why else 'false'))
          print(f'겹침 확인: {"건너뜀 — " + why if why else "실행"} · KST {kst:%m-%d %H:%M} · {os.environ.get("EVENT")} · 24시간 실행 {len(day)}번', file=open('/dev/stderr', 'w'))
          EOF
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
          EVENT: ${{ github.event_name }}
      - name: KRX 줄 서기(같은 계정으로 동시에 로그인하면 서로 끊긴다 — 한 번에 하나만, 2026-11-23)
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KRX_LOCK_WAIT_MIN: '15'
          KRX_LOCK_TTL_MIN: '45'
          KRX_LOCK_ON_TIMEOUT: skip
        run: |
          git clone -q --depth 1 -b krx-lock "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" "$RUNNER_TEMP/krxlock" || echo "KRX 줄: 받지 못함 — 줄 없이 진행"
          rc=0; if [ -f "$RUNNER_TEMP/krxlock/krx_lock.py" ]; then python3 "$RUNNER_TEMP/krxlock/krx_lock.py" acquire || rc=$?; fi
          if [ "$rc" = "3" ]; then echo "KRX 줄이 비지 않아 이번 실행은 로그인하지 않고 멈춤"; exit 1; fi
      - name: 1) 2026 빈 날짜
        id: y2026
        if: steps.guard.outputs.skip != 'true' && env.KRX_SKIP != '1'
        run: |
          if [ "$MODE" = history ]; then echo "rem=$BUDGET" >> "$GITHUB_OUTPUT"; echo "10년치만 실행"; exit 0; fi
          M=backfill; [ "$MODE" = daily ] && M=daily
          set +e; python short_collect.py --mode $M --max-calls "$BUDGET"; rc=$?; set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$MODE" = auto ] && python - <<'EOF'
          import json, datetime as d
          try: n = json.load(open('data/short/night.json'))
          except Exception: n = {}
          now = d.datetime.now(d.timezone.utc).isoformat(timespec='seconds')
          runs = (n.get('runs') or ([n['at']] if n.get('at') else [])) + [now]
          json.dump({'at': now, 'runs': runs[-12:]}, open('data/short/night.json', 'w'))
          EOF
          git add -A data/short
          git commit -q -m "공매도 2026 자료 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" || echo "변경 없음"
          git pull --rebase -q || true
          git push -q || true
          # 다음 단계로 넘길 남은 조회 수 — 2026 이 다 채워졌고(left 0) 오류·쉬는 중이 아닐 때만
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          s = json.load(open('data/short/status.json', encoding='utf-8'))
          ok = os.environ['MODE'] == 'auto' and s.get('left') == 0 and not s.get('error') and not s.get('blocked_at') and not s.get('skipped')
          print('rem=' + str(max(0, int(os.environ['BUDGET']) - int(s.get('calls') or 0)) if ok else 0))
          EOF
      - name: 2) 2016~2025 10년치(short-history 가지)
        id: hist
        if: steps.guard.outputs.skip != 'true' && env.KRX_SKIP != '1' && steps.y2026.outputs.rem != '' && fromJSON(steps.y2026.outputs.rem) >= 10
        run: |
          if git fetch -q --depth 1 origin short-history 2>/dev/null; then
            git worktree add -q -B short-history hist FETCH_HEAD
          else
            git worktree add -q --detach hist && git -C hist checkout -q --orphan short-history && git -C hist rm -rfq . && \
            printf '# 공매도 10년치(2016~2025) — short_collect.py --mode history 가 밤마다 채운다. 2026 이후는 main 의 data/short.\n' > hist/README.md
          fi
          set +e; python short_collect.py --mode history --root hist/data/short --max-calls "${{ steps.y2026.outputs.rem }}"; rc=$?; set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          git -C hist add -A .
          git -C hist commit -q -m "공매도 10년치 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" || echo "변경 없음"
          git -C hist push -q origin HEAD:short-history || true
      - name: KRX 줄 비우기
        if: always()
        run: if [ -f "$RUNNER_TEMP/krxlock/krx_lock.py" ]; then python3 "$RUNNER_TEMP/krxlock/krx_lock.py" release || true; fi
      - name: 문제가 있으면 카카오톡
        if: steps.guard.outputs.skip != 'true' && (steps.y2026.outputs.rc == '2' || steps.hist.outputs.rc == '2')
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: |
          mkdir -p report
          python - <<'EOF'
          import json, os
          msgs = []
          for name, fn in [('2026', 'data/short/status.json'), ('10년치', 'hist/data/short/status.json')]:
              if os.path.exists(fn):
                  s = json.load(open(fn, encoding='utf-8'))
                  if s.get('error'): msgs.append(f"{name}: {s['error'][:60]} · 남은 {s.get('left')}건")
          txt = '[공매도 과거 자료] 수집 멈춤 — 24시간 쉬고 다시 시도\n' + '\n'.join(msgs)
          open('report/short_alert.txt', 'w', encoding='utf-8').write(txt[:200] + '\n')
          EOF
          python kakao_send.py --file report/short_alert.txt || echo "카카오톡 발송 실패"
          git add -A state && git commit -q -m "카카오 토큰 연장" && git pull --rebase -q && git push -q || true
      - name: 요약
        if: always()
        run: |
          for f in data/short/status.json hist/data/short/status.json; do [ -f $f ] && python -c "import json;s=json.load(open('$f'));print('$f', {k:s.get(k) for k in ['updated','mode','calls','n_saved','left','error','blocked_at','first_trade','last_trade','first_balance','last_balance']})"; done; true
