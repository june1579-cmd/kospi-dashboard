# 금투협 공표 시각 재기(2026-11-24). 평일 08~16시(KST) 매시 시작해 10분마다 FreeSIS 의 마지막 기준일을 읽고, 새 기준일이 처음 보인 시각을 kofia-watch 가지에 적는다.
# 자료·대시보드는 고치지 않는다(기록만). 그날 공표를 둘 다 본 뒤에는 바로 끝난다. Claude 를 쓰지 않는다.
name: kofia-watch
run-name: ${{ github.event.inputs.slot && format('{0} · 깨우기', github.workflow) || github.workflow }}
on:
  schedule:
    - cron: '7 23 * * 0-4'    # 08:07 KST
    - cron: '7 0-7 * * 1-5'   # 09:07 ~ 16:07 KST
  workflow_dispatch:
    inputs:
      slot: {description: '깨우기 장치(ops/wake)가 넣는 예약 식 — 손으로 돌릴 때는 비워 둠', default: ''}
      loop_min:
        description: '몇 분 동안 볼지(시험은 1)'
        default: '55'
permissions:
  actions: write
  contents: write
concurrency:
  group: kofia-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      send: ${{ steps.w.outputs.send }}
    steps:
      - uses: actions/checkout@v4
      - name: 깨우기 중복 확인(늦게 온 예약 실행이면 스스로 취소 — ops/wake, 2026-11-26)
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/ops/wake/guard.py" -o "$RUNNER_TEMP/wake_guard.py" && python3 "$RUNNER_TEMP/wake_guard.py" || true
      - name: 기록 가지 준비
        run: |
          git config user.name "dashboard-bot"; git config user.email "dashboard-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin kofia-watch >/dev/null 2>&1; then
            git fetch -q --depth 1 origin kofia-watch && git worktree add -q kw FETCH_HEAD -B kofia-watch
          else
            git worktree add -q --detach kw && cd kw && git checkout -q --orphan kofia-watch && git rm -rfq . && echo "금투협 공표 시각 기록(kofia_watch.py). kofia_pub_log.csv 를 본다." > README.md && git add README.md && git commit -q -m "기록 가지 시작"
          fi
      - name: 확인
        id: w
        env:
          LOOP_MIN: ${{ github.event.inputs.loop_min || '55' }}
        run: pip -q install requests && python3 kofia_watch.py kw
      - name: 저장
        if: always()
        run: |
          cd kw; git add -A; git diff --cached --quiet && exit 0
          git commit -q -m "금투협 공표 확인 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push -q origin HEAD:kofia-watch
  notify:      # 3일치가 쌓인 날 한 번만 카카오톡
    needs: watch
    if: ${{ needs.watch.outputs.send == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: dashboard-update     # 카카오 토큰 연장이 다른 알림과 겹치지 않게 같은 줄에 선다
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests cryptography
      - name: 카카오톡(금투협 공개 시각 통계)
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: |
          git fetch -q --depth 1 origin kofia-watch && git show FETCH_HEAD:notify.txt > /tmp/kofia_notify.txt
          python kakao_send.py --file /tmp/kofia_notify.txt || echo "카카오톡 발송 실패(위 로그 참고)"
          git config user.name "dashboard-bot"; git config user.email "dashboard-bot@users.noreply.github.com"
          git add -A state && git commit -m "카카오 토큰 연장" -q && git pull -q --rebase && git push -q || true
