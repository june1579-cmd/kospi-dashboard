# Signal A X1(2026-11-24 사용자 지시 "전에 조사한 a b c d 의 각각 상위 100위 전부 거름 테스트"):
# 연구소 갈래 A·B·C·D 상위 100위를 Signal A 관찰 목록이 넘은 네 거름에 넣는다. 미리 정한 목록은 deriv/signal_a/x1/SPEC.md, 계산은 x1/run.py.
# 순서: 고정 자료 내려받기 → run.py(순위·거래일·판정·반증·보고서, 3번까지 다시) → 저장 → 카카오톡 1통.
# KRX 로그인·수집 없음. main 은 읽기만(requirements.txt·카카오 토큰 파일). 고치는 곳은 deriv/signal_a/x1, state/ledger.json, log.md 뿐.
# 예약(schedule) 없음 — deriv/signal_a/x1/run.txt 를 고쳐 push 하거나 손으로 띄울 때만 돈다. 이 파일은 deriv-research 가지에만 있다.
name: signal-a-x1
on:
  push:
    branches: [deriv-research]
    paths: ['deriv/signal_a/x1/run.txt']      # 이 파일을 고쳐 push 하면 시작
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signal-a-x1
  cancel-in-progress: false
defaults:
  run:
    shell: bash                               # bash -eo pipefail
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  x1:
    name: X1 연구소 상위 100위 거름 시험
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: deriv-research}
      - uses: actions/checkout@v4
        with: {ref: main, path: _main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q -r _main/requirements.txt joblib
      - name: 고정 자료 내려받기(릴리스 signal-a-data-v1 — sa_common.fetch 가 sha256 을 확인)
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          SA_DATA="$RUNNER_TEMP/sa_data"; mkdir -p "$SA_DATA"; echo "SA_DATA=$SA_DATA" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/deriv/signal_a" >> "$GITHUB_ENV"
          for k in 1 2 3; do gh release download signal-a-data-v1 -p panel.pkl -p lab_feat.pkl -D "$SA_DATA" --clobber && break; sleep 10; done
          test -s "$SA_DATA/panel.pkl" && test -s "$SA_DATA/lab_feat.pkl"
      - name: 계산·판정·반증·보고서(3번까지 시도)
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          LOG="$RUNNER_TEMP/x1.log"; OK=0
          for k in 1 2 3; do
            echo "::group::X1 — 시도 $k/3"
            RC=0; timeout -k 30s 100m python deriv/signal_a/x1/run.py 2>&1 | tee "$LOG" || RC=$?
            echo "::endgroup::"
            if [ "$RC" = 0 ] && [ -s deriv/signal_a/x1/report.md ] && [ -s deriv/signal_a/x1/out/done.json ]; then OK=1; break; fi
            echo "시도 $k 실패(종료 코드 $RC)"; tail -n 30 "$LOG" || true; sleep 15
          done
          if [ "$OK" != 1 ]; then echo "::error::X1 계산이 3번 모두 실패"; exit 1; fi
      - name: 저장(deriv/signal_a/x1 · 원장 · log.md 만)
        run: |
          git config user.name dashboard-bot; git config user.email dashboard-bot@users.noreply.github.com
          # log.md 는 끝에 한 줄씩 붙이는 파일 → 겹치면 양쪽 줄을 다 남긴다(이 실행기 안에서만 쓰는 설정, 저장소 파일 아님)
          GA="$(git rev-parse --git-path info/attributes)"; mkdir -p "$(dirname "$GA")"; echo 'deriv/signal_a/log.md merge=union' >> "$GA"
          git add deriv/signal_a/x1 deriv/signal_a/state/ledger.json deriv/signal_a/log.md
          if git diff --cached --quiet; then echo "저장: 바뀐 것 없음"; exit 0; fi
          git commit -q -m "Signal A X1: 연구소 상위 100위 거름 시험 결과 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            if git pull -q --rebase --autostash origin deriv-research && git push -q origin HEAD:deriv-research; then echo "저장: push 끝"; exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep 15
          done
          echo "::error::저장 실패 — 4번 시도했지만 push 하지 못함"; exit 1
      - name: 카카오톡 1통(파이프라인과 같은 방식 — 토큰은 읽기만)
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_TOKEN: ${{ github.token }}
          KAKAO_LAST: deriv/signal_a/x1/notify/last.json
        run: |
          cp _main/state/kakao_token.json "$RUNNER_TEMP/main_token.json" 2>/dev/null || true
          export TOKEN_RENEWED_AT="$(gh api "repos/$GITHUB_REPOSITORY/commits?path=state/kakao_token.json&sha=main&per_page=1" -q '.[0].commit.committer.date' 2>/dev/null || true)"
          python deriv/lab/kakao_lab.py --file deriv/signal_a/x1/notify/kakao.txt --main-state "$RUNNER_TEMP/main_token.json" --link "https://github.com/$GITHUB_REPOSITORY/blob/deriv-research/deriv/signal_a/x1/report.md" || echo "카카오톡 발송 실패(위 로그 참고)"
          # 일어나면 안 되는 일(카카오가 토큰을 일찍 연장)이 생기면 새 토큰(암호화됨)을 잃지 않게 이 폴더에 옮겨 둔다 — 다음 '알림 기록 저장'이 커밋한다
          if [ -n "$(git status --porcelain -- deriv/lab/state/kakao_renewed.json)" ]; then cp deriv/lab/state/kakao_renewed.json deriv/signal_a/x1/notify/kakao_renewed.json; echo "::error::카카오 토큰이 연장됨 — deriv/signal_a/x1/notify/kakao_renewed.json 에 보관(총괄에게 알릴 것)"; fi
      - name: 알림 기록 저장(보낸 기록)
        continue-on-error: true
        run: |
          git add deriv/signal_a/x1/notify
          if git diff --cached --quiet; then echo "저장: 바뀐 것 없음"; exit 0; fi
          git commit -q -m "Signal A X1: 카카오톡 기록 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            if git pull -q --rebase --autostash origin deriv-research && git push -q origin HEAD:deriv-research; then echo "저장: push 끝"; exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep 15
          done
          echo "::warning::알림 기록 저장 실패"
