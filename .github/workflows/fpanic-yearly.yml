name: fpanic-yearly
# 외국인 투매·개인 매수 신호의 그해 조합 10개를 해마다 1월 1일에 다시 뽑는다(pkg/fpanic_select.py, 약 1~2분).
# 전년 12월까지의 자료만으로 뽑아 pkg/fpanic_rules.json 에 그해 것을 넣고, 다음 자동 갱신(update.yml)부터 그 조합으로 신호를 계산한다.
on:
  schedule:
    - cron: '7 21 31 12 *'   # 1월 1일 06:07 KST
    - cron: '7 21 2 1 *'     # 1월 3일 06:07 KST — 첫 실행이 빠졌을 때의 예비(이미 뽑았으면 건너뜀)
  workflow_dispatch:
    inputs:
      year:
        description: '뽑을 해(비우면 올해)'
        default: ''
      force:
        description: 'true 면 이미 있어도 다시 뽑음'
        default: 'false'
permissions:
  contents: write
concurrency:
  group: dashboard-update      # 매일 갱신과 같은 줄에 세워 저장 충돌을 피한다
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 조합 다시 뽑기
        id: sel
        run: |
          ARGS=""; [ -n "${{ github.event.inputs.year }}" ] && ARGS="--year ${{ github.event.inputs.year }}"
          [ "${{ github.event.inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          python pkg/fpanic_select.py $ARGS
          if git diff --quiet pkg/fpanic_rules.json; then echo "changed=0" >> "$GITHUB_OUTPUT"; else echo "changed=1" >> "$GITHUB_OUTPUT"; fi
      - name: 결과 저장(commit & push)
        if: steps.sel.outputs.changed == '1'
        run: |
          git config user.name "dashboard-bot"; git config user.email "dashboard-bot@users.noreply.github.com"
          git add pkg/fpanic_rules.json report/kakao_fpanic.txt
          git commit -m "외국인 투매·개인 매수 신호: 조합 다시 뽑음 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git pull --rebase -q || true
          git push
      - name: 카카오톡 안내
        if: steps.sel.outputs.changed == '1'
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          DASH_LINK: https://june1579-cmd.github.io/kospi-dashboard/
        run: |
          python kakao_send.py --file report/kakao_fpanic.txt || echo "카카오톡 발송 실패(위 로그 참고)"
          git add -A state && git commit -m "카카오 토큰 연장" -q && git push -q || true
