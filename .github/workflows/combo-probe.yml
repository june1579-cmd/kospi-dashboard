# 조건 조합 전부 훑기 검증(일회성, 사용자 요청 2026-11-23).
# 1차 실행(45152107255): 자료표를 만들고 맞춤 12개(전체 기간 + 2016~2026년)를 조합 4개까지 돌림 → deriv/combo/out
# 2차 실행(이 파일): 같은 자료표(1차 실행이 올려 둔 것)로 조합 3개까지 다시 돌려 ① 1차와 숫자가 같은지 재현 확인 ② '합친 신호' 표를 고친 계산으로 다시 만들고
#                   ③ 연구소 통과·관찰 숫자 꼴 규칙을 더해 잰다 → deriv/combo/out3. KRX 로그인 없음.
name: combo-probe
on:
  push:
    branches: [deriv-research]
    paths: ['deriv/combo/trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: combo-probe
  cancel-in-progress: true
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        fit: ['2016', '2017', '2018', '2019', '2020', '2021', '2022', '2023', '2024', '2025', '2026']
    steps:
      - uses: actions/checkout@v4
        with: {ref: deriv-research}
      - uses: actions/checkout@v4
        with: {ref: main, path: _main, sparse-checkout: requirements.txt, sparse-checkout-cone-mode: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q -r _main/requirements.txt
      - uses: actions/download-artifact@v4
        with: {name: panel, path: deriv/uni/out, run-id: 45152107255, github-token: '${{ github.token }}'}
      - name: 검산(뻔한 계산과 숫자가 같은지)
        run: cd deriv/combo && nproc && python test_core.py
      - name: 전부 훑기(조합 3개까지)
        run: cd deriv/combo && python combo_probe.py --fit ${{ matrix.fit }} --maxlevel 3 --null 4 --out out3
      - uses: actions/upload-artifact@v4
        with: {name: 'fit3-${{ matrix.fit }}', path: 'deriv/combo/out3/fit_${{ matrix.fit }}.json', retention-days: 3}
  report:
    needs: fit
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: deriv-research}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q numpy
      - uses: actions/download-artifact@v4
        with: {pattern: 'fit3-*', path: deriv/combo/out3, merge-multiple: true}
      - run: python deriv/combo/combo_report.py > /dev/null && tail -3 deriv/combo/out/report.md
      - name: 저장
        run: |
          git config user.name "dashboard-bot"; git config user.email "dashboard-bot@users.noreply.github.com"
          git add deriv/combo/out deriv/combo/out3
          git diff --cached --quiet && exit 0
          git commit -q -m "조건 조합 전부 훑기 검증 2차 결과 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do git pull -q --rebase origin deriv-research && git push -q origin HEAD:deriv-research && break; sleep 15; done
