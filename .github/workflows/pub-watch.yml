# 미국 옵션 자료 공개 시각 재기(2026-11-24). 한 시간마다 시작해 55분 동안 10분 간격으로 출처별 기준값을 읽고, 바뀐 첫 시각을 pub-watch 가지에 적는다.
# 자료·대시보드는 고치지 않는다(기록만). 5거래일치가 모이거나 8일이 지나면 카카오톡으로 한 번 요약하고 이 워크플로를 스스로 끈다. Claude 를 쓰지 않는다.
name: pub-watch
run-name: ${{ github.event.inputs.slot && format('{0} · 깨우기', github.workflow) || github.workflow }}
on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
    inputs:
      slot: {description: '깨우기 장치(ops/wake)가 넣는 예약 식 — 손으로 돌릴 때는 비워 둠', default: ''}
      loop_min:
        description: '몇 분 동안 볼지(시험은 1)'
        default: '55'
permissions:
  contents: write
  actions: write
concurrency:
  group: pub-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      send: ${{ steps.w.outputs.send }}
    steps:
      - uses: actions/checkout@v4
      - name: 깨우기 중복 확인(늦게 온 예약 실행이면 스스로 취소 — ops/wake, 2026-11-26)
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/ops/wake/guard.py" -o "$RUNNER_TEMP/wake_guard.py" && python3 "$RUNNER_TEMP/wake_guard.py" || true
      - name: 기록 가지 준비
        run: |
          git config user.name "dashboard-bot"; git config user.email "dashboard-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin pub-watch >/dev/null 2>&1; then
            git fetch -q --depth 1 origin pub-watch && git worktree add -q pw FETCH_HEAD -B pub-watch
          else
            git worktree add -q --detach pw && cd pw && git checkout -q --orphan pub-watch && git rm -rfq . && echo "미국 옵션 자료 공개 시각 기록(uswalls/pubwatch.py). log.csv · summary.json 을 본다." > README.md && git add README.md && git commit -q -m "기록 가지 시작"
          fi
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests yfinance
      - name: 확인
        id: w
        env:
          LOOP_MIN: ${{ github.event.inputs.loop_min || '55' }}
        run: python3 uswalls/pubwatch.py pw
      - name: 저장
        if: always()
        run: |
          cd pw; git add -A; git diff --cached --quiet && exit 0
          git commit -q -m "공개 시각 확인 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git push -q origin HEAD:pub-watch && exit 0; git pull -q --rebase origin pub-watch; done
      - name: 측정이 끝났으면 이 워크플로 끄기
        if: ${{ steps.w.outputs.send == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable pub-watch.yml -R "${{ github.repository }}" || echo "끄기 실패(다음 실행은 바로 끝남)"
  notify:      # 측정이 끝난 날 한 번만 카카오톡
    needs: watch
    if: ${{ needs.watch.outputs.send == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: dashboard-update     # 카카오 토큰 연장이 다른 알림과 겹치지 않게 같은 줄에 선다
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests cryptography
      - name: 카카오톡(공개 시각 요약)
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: |
          git fetch -q --depth 1 origin pub-watch && git show FETCH_HEAD:notify.txt > /tmp/pw_notify.txt
          python kakao_send.py --file /tmp/pw_notify.txt --link https://june1579-cmd.github.io/kospi-dashboard/fo/#s11 || echo "카카오톡 발송 실패(위 로그 참고)"
          git config user.name "dashboard-bot"; git config user.email "dashboard-bot@users.noreply.github.com"
          git add -A state && git commit -m "카카오 토큰 연장" -q && git pull -q --rebase && git push -q || true
