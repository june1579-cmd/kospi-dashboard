name: evolve-gate
# 진화 에이전트 시험(2026-11-22). evolve/ 로 시작하는 가지를 push 하면 돈다(PR 은 쓰지 않음 — 기본 가지가 아니라 PR 이벤트가 오지 않음).
# 시험 코드(deriv/lab/evolve/)·잠금 파일·자료는 항상 기준 가지(deriv-research)의 것을 쓴다. 워크플로(.github/)를 바꾼 가지는 판정에서 탈락한다.
# 통과하면 deriv-research 에 자동으로 합치고(한 커밋), 시험이 끝난 가지는 지우며, 결과는 deriv/lab/evolve_notes/gate/<가지 이름>.md 에 남긴다. 비밀값은 쓰지 않는다(KRX 로그인 없음).
on:
  push:
    branches: ['evolve/**']
permissions:
  contents: read
concurrency:
  group: evolve-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [base-full, head-full, base-trunc, head-trunc]
    steps:
      - uses: actions/checkout@v4
        with: {ref: deriv-research, path: base}
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', path: head}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas numpy scipy scikit-learn
      - name: 작업 폴더 만들기(잠금 파일·자료는 항상 기준 것)
        run: |
          V="${{ matrix.variant }}"
          if [[ "$V" == head-* ]]; then
            cp -r head work
            for f in a08_validate.py a10_redteam.py lab_merge.py lab_common.py prune_rounds.py; do cp base/deriv/lab/$f work/deriv/lab/$f; done
            rm -rf work/deriv/lab/evolve work/deriv/data; cp -r base/deriv/lab/evolve work/deriv/lab/evolve; cp -r base/deriv/data work/deriv/data
            cp base/deriv/lab/round*.json work/deriv/lab/
          else
            cp -r base work
          fi
          CUT=$(date -u -d '365 days ago' +%F); echo "CUT=$CUT" >> $GITHUB_ENV
          if [[ "$V" == *-trunc ]]; then python work/deriv/lab/evolve/truncate.py "$CUT"; fi
      - name: 시험 라운드
        run: |
          cd work && bash deriv/lab/evolve/run_round.sh
          mkdir -p ../res && cp steps.json ../res/ 2>/dev/null || true
          mkdir -p ../res/out_t && cp -r deriv/lab/out_t/. ../res/out_t/ 2>/dev/null || true
          mkdir -p ../res/logs && cp log_*.txt ../res/logs/ 2>/dev/null || true
          find ../res -name 'dev_passed.pkl' -delete || true
      - uses: actions/upload-artifact@v4
        with: {name: 'res-${{ matrix.variant }}', path: res, retention-days: 5}
  judge:
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: deriv-research, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas numpy
      - uses: actions/download-artifact@v4
        with: {pattern: 'res-*', path: res}
      - name: 판정(기준 가지의 gate.py)
        run: |
          git fetch -q origin "${{ github.sha }}"
          git diff --name-only "HEAD...${{ github.sha }}" > changed.txt
          CUT=$(date -u -d '365 days ago' +%F)
          python deriv/lab/evolve/gate.py changed.txt res/res-base-full res/res-head-full res/res-base-trunc res/res-head-trunc "$CUT"
      - uses: actions/upload-artifact@v4
        with: {name: gate-result, path: 'gate_result.*', retention-days: 30}
  merge:
    needs: judge
    if: always() && needs.judge.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: deriv-research, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: gate-result, path: gate}
      - name: 합치기(통과) · 결과 남기기
        env:
          SHA: ${{ github.sha }}
          BR: ${{ github.ref_name }}
        run: |
          git config user.name "dashboard-bot"; git config user.email "dashboard-bot@users.noreply.github.com"
          git fetch -q origin "$SHA"
          NAME="${BR#evolve/}"; mkdir -p deriv/lab/evolve_notes/gate
          PASS=$(python -c "import json; print('1' if json.load(open('gate/gate_result.json'))['pass'] else '0')")
          if [ "$PASS" = "1" ]; then
            if git merge --squash "$SHA"; then
              git commit -q -m "진화 합침: $BR (evolve-gate 통과)" || echo "바뀐 것 없음"
            else
              git merge --abort 2>/dev/null || git reset -q --hard HEAD
              PASS=0; printf '\n\n**합치지 못함**: 기준 가지와 충돌 — 최신 deriv-research 위에서 다시 만들어 주세요.\n' >> gate/gate_result.md
              sed -i '1s/.*/## 진화 시험 통과했으나 충돌로 합치지 못함/' gate/gate_result.md
            fi
          fi
          { cat gate/gate_result.md; printf '\n\n가지: %s · 커밋: %s · %s\n' "$BR" "$SHA" "$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"; } > "deriv/lab/evolve_notes/gate/$NAME.md"
          git add deriv/lab/evolve_notes/gate && git commit -q -m "진화 시험 결과: $BR $([ "$PASS" = "1" ] && echo 통과 || echo 탈락)"
          for i in 1 2 3 4; do git pull -q --rebase origin deriv-research && git push -q origin HEAD:deriv-research && break; sleep 15; done
          git push -q origin --delete "$BR" || true   # 통과·탈락 모두 가지는 지움(결과는 evolve_notes/gate 에 남음)
