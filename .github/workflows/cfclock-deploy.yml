# 장중 도달 확률 정시 시계(Cloudflare Worker) 배포 — 2026-11-27 사용자 지시("GitHub 예약이 늦어 08:30·09:10 전에 결과가 안 나옴").
# cfclock/ 이 바뀌어 main 에 올라오거나 손으로 실행하면 배포한다. push·손 실행은 GitHub 예약과 달리 늦지 않는다.
# 필요한 Secrets(이름만 씀): CLOUDFLARE_API_TOKEN, CF_GH_DISPATCH_TOKEN, (있으면) CLOUDFLARE_ACCOUNT_ID
name: cfclock-deploy
on:
  push:
    branches: [main]
    paths: ['cfclock/**', '.github/workflows/cfclock-deploy.yml']
  workflow_dispatch:
    inputs:
      test_dispatch: {description: '토큰으로 실제 실행 요청 시험(reach.yml what 값: eve/pre, 비우면 안 함)', default: ''}
permissions:
  contents: read
concurrency:
  group: cfclock-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: 로컬 점검(가짜 GitHub)
        working-directory: cfclock
        run: node test.mjs
      - name: 배포
        working-directory: cfclock
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_DISPATCH: ${{ secrets.CF_GH_DISPATCH_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$GH_DISPATCH" ]; then
            echo "::warning::Secrets 가 아직 없음(CLOUDFLARE_API_TOKEN·CF_GH_DISPATCH_TOKEN) — 등록 뒤 이 작업을 다시 실행하세요."; exit 0; fi
          export CLOUDFLARE_API_TOKEN="$CF_TOKEN"
          [ -n "$CF_ACC" ] && export CLOUDFLARE_ACCOUNT_ID="$CF_ACC"
          npx -y wrangler@4 deploy
          printf '%s' "$GH_DISPATCH" | npx -y wrangler@4 secret put GH_TOKEN
          echo "배포 끝 — 예약(UTC): $(grep crons wrangler.toml)"
      - name: 토큰 권한 확인(실행 요청 없이 읽기만)
        env:
          GH_DISPATCH: ${{ secrets.CF_GH_DISPATCH_TOKEN }}
        run: |
          [ -z "$GH_DISPATCH" ] && exit 0
          for p in "contents/docs/reach/data/pre.json?ref=main" "actions/workflows/intraday-flow.yml/runs?per_page=1"; do
            c=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_DISPATCH" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/$p")
            echo "$p → $c"; [ "$c" = "200" ] || echo "::error::토큰으로 $p 를 읽지 못함($c) — 토큰 권한(Contents 읽기·Actions 읽기쓰기, 이 저장소)을 확인하세요."
          done
      - name: 실행 요청 시험(손으로 고른 때만)
        if: ${{ github.event.inputs.test_dispatch != '' }}
        env:
          GH_DISPATCH: ${{ secrets.CF_GH_DISPATCH_TOKEN }}
        run: |
          c=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_DISPATCH" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/reach.yml/dispatches" -d '{"ref":"main","inputs":{"what":"${{ github.event.inputs.test_dispatch }}"}}')
          echo "reach.yml what=${{ github.event.inputs.test_dispatch }} → $c"; [ "$c" = "204" ] || { echo "::error::실행 요청 실패($c) — 토큰의 Actions 권한이 Read and write 인지 확인"; exit 1; }
