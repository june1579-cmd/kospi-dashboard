# 정해진 시각 깨우기 장치 배포(2026-11-26, 업그레이드 요청 U-1126-2). GitHub 예약이 몇 시간씩 늦거나 빠져서(7일 예약 지킴 30%),
# Cloudflare Worker(무료 Cron Trigger, 매분)가 정해진 시각에 workflow_dispatch 로 워크플로를 부른다. GitHub 예약은 예비로 남고,
# 늦게 온 예약 실행은 각 워크플로의 깨우기 중복 확인(ops/wake/guard.py)이 스스로 취소한다. 설명·사용자 할 일: ops/wake/README.md
#  필요한 저장소 비밀값(사용자가 넣음, 대화에 붙이지 않음): CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID · WAKE_GITHUB_TOKEN(없으면 정시 시계용 CF_GH_DISPATCH_TOKEN 을 같이 씀, 2026-11-27)
#  비밀값이 없으면 배포하지 않고 '비밀값 없음'만 남긴다(실패로 치지 않음). 배포가 되면 ops/wake/active.json 을 켠다.
name: wake-deploy
on:
  push:
    branches: [main]
    paths: ['ops/wake/**', '.github/workflows/wake-deploy.yml']
  workflow_dispatch:
    inputs:
      off:
        description: 'true 면 장치를 끈다(active false, Worker 예약 비움)'
        default: 'false'
permissions:
  contents: write
concurrency:
  group: wake-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: pip install -q pyyaml
      - name: 표 만들기
        run: python3 ops/wake/build.py
      - name: 비밀값 확인
        id: s
        env:
          A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          B: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          C: ${{ secrets.WAKE_GITHUB_TOKEN || secrets.CF_GH_DISPATCH_TOKEN }}
        run: |
          miss=""; [ -n "$A" ] || miss="$miss CLOUDFLARE_API_TOKEN"; [ -n "$B" ] || miss="$miss CLOUDFLARE_ACCOUNT_ID"; [ -n "$C" ] || miss="$miss WAKE_GITHUB_TOKEN"
          if [ -n "$miss" ]; then echo "비밀값 없음:$miss — 배포하지 않음(ops/wake/README.md 의 사용자 할 일)"; echo "ok=0" >> "$GITHUB_OUTPUT"; else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - name: 끄기 선택이면 예약 비우기
        if: ${{ steps.s.outputs.ok == '1' && github.event.inputs.off == 'true' }}
        run: sed -i 's/^crons = .*/crons = []/' ops/wake/dist/wrangler.toml
      - name: Worker 배포(Cron Trigger 매분)
        if: ${{ steps.s.outputs.ok == '1' }}
        working-directory: ops/wake/dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WAKE_GITHUB_TOKEN: ${{ secrets.WAKE_GITHUB_TOKEN || secrets.CF_GH_DISPATCH_TOKEN }}
        run: |
          npx --yes wrangler@3 deploy
          printf '%s' "$WAKE_GITHUB_TOKEN" | npx --yes wrangler@3 secret put GH_TOKEN
      - name: 켜짐 기록(바뀐 때만)
        if: ${{ steps.s.outputs.ok == '1' }}
        run: |
          ACT=true; [ "${{ github.event.inputs.off }}" = "true" ] && ACT=false
          python3 - "$ACT" <<'EOF'
          import json, sys, datetime as dt
          act = sys.argv[1] == 'true'; p = 'ops/wake/active.json'
          old = json.load(open(p, encoding='utf-8'))
          tbl = json.load(open('ops/wake/dist/table.json', encoding='utf-8'))
          new = dict(old, active=act, workflows=tbl['workflows'], entries=len(tbl['entries']), skipped=tbl['skipped'])
          if act and not old.get('active'): new['since'] = dt.datetime.now(dt.timezone(dt.timedelta(hours=9))).strftime('%Y-%m-%d %H:%M')
          if new != old: json.dump(new, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=1); open(p, 'a').write('\n')
          EOF
          git config user.name "dashboard-bot"; git config user.email "dashboard-bot@users.noreply.github.com"
          git add ops/wake/active.json; git diff --cached --quiet && { echo "기록 그대로"; exit 0; }
          git commit -q -m "깨우기 장치 $( [ "$ACT" = true ] && echo 켬 || echo 끔 ) $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do if git pull -q --rebase; then git push -q && exit 0; else git rebase --abort 2>/dev/null || true; fi; sleep $((i * 5)); done
          echo "기록 저장 실패"; exit 1
