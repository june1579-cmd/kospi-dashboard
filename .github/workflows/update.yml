name: dashboard-update
on:
  schedule:
    - cron: '31 23 * * 0-4'   # 08:31 KST 월~금(UTC 일~목 23:31) 아침 확정 — 전 거래일 VKOSPI(공개 저장소 08:10~08:15)·투자자별 확정치·간밤 VIX
    - cron: '37 6 * * 1-5'    # 15:37 KST 잠정 — 15:30 정규장 마감 종가·투자자별 잠정치·금투협 전 거래일분
    - cron: '37 11 * * 1-5'   # 20:37 KST 확정 — 애프터마켓 20:00 마감 뒤 투자자별·ETF 투자자별
  workflow_dispatch:
    inputs:
      tag:
        description: '0831(아침 확정) · 1540(잠정) · 1840(확정)'
        default: '1840'
permissions:
  contents: write
concurrency:
  group: dashboard-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 한글 글꼴(그래프용)
        run: sudo apt-get install -y -q fonts-nanum >/dev/null && fc-cache -f >/dev/null || echo "글꼴 설치 실패 — 그래프는 영문 표기"
      - name: 실행 구분(08:31 → 0831, 15:37 → 1540, 20:37 → 1840)
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then T="${{ github.event.inputs.tag }}"; else H=$(TZ=Asia/Seoul date +%H%M); if [ "$H" -lt 1200 ]; then T=0831; elif [ "$H" -lt 1730 ]; then T=1540; else T=1840; fi; fi
          echo "tag=$T" >> "$GITHUB_OUTPUT"; echo "실행 구분 $T ($(TZ=Asia/Seoul date))"
      - name: 수집 → 엑셀 갱신 → 재계산 → 보고 → 카카오톡
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          DASH_LINK: https://june1579-cmd.github.io/kospi-dashboard/   # 카톡 [대시보드 열기] → 웹판(GitHub Pages)
        run: python run_pipeline.py --tag "${{ steps.tag.outputs.tag }}" --no-kakao
      - name: 결과 저장(commit & push)
        run: |
          git config user.name "dashboard-bot"; git config user.email "dashboard-bot@users.noreply.github.com"
          # data/public 은 공개 저장소 clone(중첩 git)이라 저장소에 넣지 않는다 — 가짜 서브모듈(gitlink)로 들어가면 Pages 배포(checkout)가 실패한다
          git rm -r --cached --quiet data/public 2>/dev/null || true
          printf 'data/public/\ndata/collect/*.zip\n__pycache__/\n*.pyc\n' > .gitignore; git add .gitignore
          mkdir -p state out report docs; git add -A data out report state docs
          git commit -m "자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') ${{ steps.tag.outputs.tag }}" || echo "변경 없음"
          git pull --rebase -q || true
          git push
      - name: 카카오톡(매수·매도 신호 발생/미발생 + 결론, 글만)
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          DASH_LINK: https://june1579-cmd.github.io/kospi-dashboard/   # 카톡 [대시보드 열기] → 웹판(GitHub Pages)
        run: |
          if [ -s report/kakao.txt ]; then
            python kakao_send.py --file report/kakao.txt || echo "카카오톡 발송 실패(위 로그 참고)"
            git add -A state && git commit -m "카카오 토큰 연장" -q && git push -q || true
          fi
      - name: 보고문 요약
        run: cat report/latest.md | head -40
