# 통과 기준 검증 · 통과 신호 합치기 연구 (사용자 요청 2026-11-23).
# 읽기 전용 계산: 연구소 후보·가격만 읽고 판정·설정·상태는 건드리지 않는다. 결과는 deriv/lab/study/out/ 에만 저장.
# deriv/lab/study/trigger.txt 를 push 하면 실행(연구소 라운드·수집 워크플로와 경로가 겹치지 않음).
name: criteria-study
on:
  push:
    branches: [deriv-research]
    paths: ['deriv/lab/study/trigger.txt']
permissions:
  contents: write
concurrency:
  group: criteria-study
  cancel-in-progress: true
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: deriv-research}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas numpy scipy scikit-learn
      - name: 연구 실행
        env: {STUDY_B: '2000'}
        run: python deriv/lab/study/criteria_study.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: criteria-study-out, path: deriv/lab/study/out, if-no-files-found: ignore}
      - name: 결과 저장
        run: |
          git config user.name "dashboard-bot"; git config user.email "dashboard-bot@users.noreply.github.com"
          git add deriv/lab/study/out
          git diff --cached --quiet && exit 0
          git commit -q -m "통과 기준·신호 합치기 연구 결과 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do git pull -q --rebase origin deriv-research && git push -q origin HEAD:deriv-research && break; sleep 15; done
