# 연구소용 웹판 자료 내보내기(2026-11-24 사용자 지시, deriv/labweb/AGENT.md).
# 새로 계산하는 것은 '조합별 매매 날짜' 하나 — X1(deriv/signal_a/x1)이 쓰는 함수를 그대로 불러 같은 거래를 파일로 옮긴다(deriv/labweb/export.py).
# 순서: 고정 자료 내려받기 → x1/extract.py(연구소 거래일 파일을 연구소와 같은 환경에서 옮김, 읽기만) → export.py → main 의 docs/lab/data/ 에 커밋.
# KRX 로그인·수집 없음. 비밀값 없음. 예약(schedule) 없음 — deriv/labweb/run.txt 를 고쳐 push 할 때나 손으로 띄울 때만 돈다.
# 고치는 곳: main 의 docs/lab/data/, deriv-research 의 deriv/labweb/out/ 뿐.
name: labweb-data
on:
  push:
    branches: [deriv-research]
    paths: ['deriv/labweb/run.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: labweb-data
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  export:
    name: 연구소 웹판 자료 내보내기
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {ref: deriv-research}
      - uses: actions/checkout@v4
        with: {ref: main, path: _main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q -r _main/requirements.txt joblib
      - name: 고정 자료 내려받기(릴리스 signal-a-data-v1)
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          SA_DATA="$RUNNER_TEMP/sa_data"; mkdir -p "$SA_DATA"; echo "SA_DATA=$SA_DATA" >> "$GITHUB_ENV"
          for k in 1 2 3; do gh release download signal-a-data-v1 -p panel.pkl -p lab_feat.pkl -D "$SA_DATA" --clobber && break; sleep 10; done
          test -s "$SA_DATA/panel.pkl" && test -s "$SA_DATA/lab_feat.pkl"
      - name: 연구소 거래일 파일 옮기기(x1/extract.py 그대로 — 판다스 최신판 환경)
        run: |
          python -m venv "$RUNNER_TEMP/labenv"
          "$RUNNER_TEMP/labenv/bin/pip" install -q pandas numpy
          X1_LAB_CACHE="$RUNNER_TEMP/x1_lab"; mkdir -p "$X1_LAB_CACHE"; echo "X1_LAB_CACHE=$X1_LAB_CACHE" >> "$GITHUB_ENV"
          OK=0
          for k in 1 2 3; do
            if "$RUNNER_TEMP/labenv/bin/python" deriv/signal_a/x1/extract.py --out "$X1_LAB_CACHE"; then OK=1; break; fi
            echo "시도 $k 실패"; sleep 10
          done
          if [ "$OK" != 1 ]; then echo "::error::연구소 거래일 파일을 읽지 못함"; exit 1; fi
      - name: 내보내기(3번까지 시도)
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          OUT="$RUNNER_TEMP/labweb"; mkdir -p "$OUT"; OK=0
          for k in 1 2 3; do
            if python deriv/labweb/export.py --out "$OUT"; then OK=1; break; fi
            echo "시도 $k 실패"; sleep 10
          done
          if [ "$OK" != 1 ]; then echo "::error::내보내기 3번 모두 실패"; exit 1; fi
          mkdir -p _main/docs/lab/data deriv/labweb/out
          cp "$OUT"/combos.json "$OUT"/trades.json "$OUT"/prices.json "$OUT"/meta.json _main/docs/lab/data/
          cp "$OUT"/meta.json deriv/labweb/out/meta.json
          ls -la _main/docs/lab/data
      - name: main 에 저장(docs/lab/data 만)
        working-directory: _main
        run: |
          git config user.name dashboard-bot; git config user.email dashboard-bot@users.noreply.github.com
          git add docs/lab/data
          if git diff --cached --quiet; then echo "저장: 바뀐 것 없음"; exit 0; fi
          git commit -q -m "연구소 웹판: 조합·거래·가격 자료 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            if git pull -q --rebase --autostash origin main && git push -q origin HEAD:main; then echo "저장: push 끝"; exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep 15
          done
          echo "::error::main 저장 실패 — 3번 시도"; exit 1
      - name: 확인 기록 저장(deriv/labweb/out 만)
        continue-on-error: true
        run: |
          git config user.name dashboard-bot; git config user.email dashboard-bot@users.noreply.github.com
          git add deriv/labweb/out
          if git diff --cached --quiet; then echo "저장: 바뀐 것 없음"; exit 0; fi
          git commit -q -m "연구소 웹판: 내보내기 확인 기록 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            if git pull -q --rebase --autostash origin deriv-research && git push -q origin HEAD:deriv-research; then echo "저장: push 끝"; exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep 15
          done
          echo "::warning::확인 기록 저장 실패"
