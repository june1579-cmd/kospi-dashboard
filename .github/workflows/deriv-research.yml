name: deriv-research
# 선물·옵션 수급 지표 연구(1차 단계) — deriv-research 가지 전용. main·대시보드·웹판·카톡은 건드리지 않는다.
# deriv/trigger.txt 를 바꿔 push 하면 돈다(첫 줄 = 모드: probe | full | analyze, 나머지는 인자).
# 대시보드 수집 시간대(08:15~10:50 · 15:35~18:05 · 20:15~22:50 KST)에는 KRX 로그인이 겹치지 않도록 collect.py 가 스스로 기다린다.
on:
  push:
    branches: [deriv-research]
    paths: ['deriv/trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deriv-research-v2
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deriv-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: 실행
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          MODE=$(head -1 deriv/trigger.txt | tr -d '\r'); ARGS=$(sed -n 2p deriv/trigger.txt | tr -d '\r')
          echo "모드 $MODE 인자 $ARGS"
          if [ "$MODE" = "analyze" ]; then python deriv/analyze.py $ARGS; else python deriv/collect.py "$MODE" $ARGS; fi
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "dashboard-bot"; git config user.email "dashboard-bot@users.noreply.github.com"
          git add -A deriv/data deriv/out || true
          git commit -q -m "deriv-research $(head -1 deriv/trigger.txt) $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" || echo "변경 없음"
          git pull --rebase -q origin deriv-research || true
          git push -q origin HEAD:deriv-research
