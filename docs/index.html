<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>미수 반대매매·신용 대시보드 웹판</title>
<meta name="description" content="코스피 미수 반대매매·신용·매매 신호 대시보드 웹판 — 저장소에 올라온 자료까지 보여준다">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{--font-anthropic-sans:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;--font-anthropic-serif:"Noto Serif KR","Apple SD Gothic Neo",Georgia,serif;
--color-bg:#f6f7f9;--color-panel:#ffffff;--color-fg:#1b1f24;--color-fg-muted:#6b7280;--color-border-line:#e5e7eb;--color-ok:#2e7d32;--color-bad:#c62828;
--cds-font-size-title:22px;--cds-font-size-heading:17px;--cds-font-size-body:15px;--cds-font-size-caption:12.5px;--cds-font-weight-medium:600;
--cds-gap-xs:6px;--cds-gap-sm:10px;--cds-gap-md:14px;--cds-gap-xl:28px;--cds-pad-xs:6px;--cds-pad-sm:10px;--cds-pad-md:14px;--cds-pad-lg:20px;--cds-radius:12px;--cds-border:1px solid var(--color-border-line);
--cds-chart-grid:#e5e7eb;--cds-chart-axis:#9aa3ad;--cds-chart-reference:#9aa3ad;--cds-chart-muted:#b0b7c0;--cds-chart-status-critical:#c62828;--cds-text-secondary:#6b7280;--cds-surface-popover:#ffffff;--cds-shadow-popover:0 4px 16px rgba(0,0,0,.15);--cds-dur-slow:.3s}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--color-bg:#0f1216;--color-panel:#171b21;--color-fg:#e6e8eb;--color-fg-muted:#9aa3ad;--color-border-line:#2a3038;--color-ok:#66bb6a;--color-bad:#ef5350;--cds-chart-grid:#2a3038;--cds-chart-axis:#8a93a0;--cds-chart-reference:#8a93a0;--cds-chart-muted:#5c6570;--cds-text-secondary:#9aa3ad;--cds-surface-popover:#1e232b;--cds-shadow-popover:0 4px 16px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--color-bg:#0f1216;--color-panel:#171b21;--color-fg:#e6e8eb;--color-fg-muted:#9aa3ad;--color-border-line:#2a3038;--color-ok:#66bb6a;--color-bad:#ef5350;--cds-chart-grid:#2a3038;--cds-chart-axis:#8a93a0;--cds-chart-reference:#8a93a0;--cds-chart-muted:#5c6570;--cds-text-secondary:#9aa3ad;--cds-surface-popover:#1e232b;--cds-shadow-popover:0 4px 16px rgba(0,0,0,.5)}
html,body{margin:0;background:var(--color-bg);color:var(--color-fg);font-family:var(--font-anthropic-sans);font-size:var(--cds-font-size-body);line-height:1.5}
#dash-root{max-width:1180px;margin:0 auto;padding:12px 14px 40px}
#dash-root .rv-card{background:var(--color-panel)}
.web-bar{font-size:12.5px;color:var(--color-fg-muted);margin:0 0 10px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.web-bar a{color:inherit}
.web-bar button{border:1px solid var(--color-border-line);background:var(--color-panel);color:var(--color-fg);border-radius:999px;padding:3px 12px;font-size:12.5px;cursor:pointer}
.dash-skeleton{position:relative;min-height:1em}
.dash-skeleton::after{content:"";position:absolute;inset:0;border-radius:6px;background:linear-gradient(90deg,rgba(128,128,128,.08),rgba(128,128,128,.18),rgba(128,128,128,.08));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.web-err{background:#fde8e8;color:#8a1c1c;padding:10px;border-radius:8px;margin:0 0 12px}
</style>
</head>
<body>
<div id="dash-root">
<div class="web-bar" id="web-bar"><span>웹판 · 자료 읽는 중…</span> <button type="button" onclick="location.href=location.pathname+'?r='+Date.now()">갱신</button> <a href="https://claude.ai/artifact/LREkdE8UfEYhuNn6Jpn67c" target="_blank" rel="noopener">Claude 대시보드</a> <a href="https://github.com/june1579-cmd/kospi-dashboard" target="_blank" rel="noopener">저장소</a></div>
<div id="page"></div>
<p class="web-bar" style="justify-content:center;margin-top:20px">투자 권유 아님</p>
</div>
<script>
// 웹판 = Claude 대시보드 페이지(page.html, 아티팩트 files/index.html 과 같은 글)를 그대로 읽어 붙이고,
// 대시보드 실행기(dash) 대신 data/*.csv 를 읽는 같은 API 를 제공한다. 자료는 저장소에 올라온 것까지(열 때마다 새로 읽음).
// 업그레이드: 대시보드 페이지가 바뀌면 page.html 한 파일만 바꾸면 된다. 자료 파일 목록(data/*.csv)은 FILES 에 있다.
window.dash = (function(){
  const FILES = {"lead_cmp": "lead_cmp.csv", "fut_daily": "fut_daily.csv", "credit": "credit.csv", "alarms": "alarms.csv", "ind_risk": "ind_risk.csv", "ind_scores": "ind_scores.csv", "events": "events.csv", "trend_years": "trend_years.csv", "q_years": "q_years.csv", "buy3": "buy3.csv", "flows": "flows.csv", "gap_table": "gap_table.csv", "episodes": "episodes.csv", "monthly": "monthly.csv", "credit_change": "credit_change.csv", "q_strat": "q_strat.csv", "q_models": "q_models.csv", "ret26": "ret26.csv", "leverage": "leverage.csv", "etf_lev": "etf_lev.csv", "trend_champ_rules": "trend_champ_rules.csv", "ind_now": "ind_now.csv", "ind_warn": "ind_warn.csv", "combo_wf": "combo_wf.csv", "reentry": "reentry.csv", "q_ic": "q_ic.csv", "q_daily": "q_daily.csv", "combo": "combo.csv", "q_sens": "q_sens.csv", "night_fut": "night_fut.csv", "concentration": "concentration.csv", "combo_select": "combo_select.csv", "ind_trade": "ind_trade.csv", "lag": "lag.csv", "q_attr": "q_attr.csv", "combo_table": "combo_table.csv", "liq": "liq_daily.csv", "market": "market_daily.csv", "fx_daily": "fx_daily.csv", "combo_now": "combo_now.csv", "flows_daily": "flows_daily.csv", "trend_champ": "trend_champ.csv", "q_now": "q_now.csv", "sell3": "sell3.csv", "am_daily": "am_daily.csv", "am_bucket": "am_bucket.csv", "am_stocks": "am_stocks.csv", "am_now": "am_now.csv", "am_stats": "am_stats.csv", "relief": "relief.csv"};
  const store = {}, calcs = {}, cbs = []; let loaded = false;
  // 대시보드 실행기처럼 숫자 글자는 숫자로 바꾼다(날짜 '2026-10-30' 같은 글자는 그대로). 글자 그대로 두면 최소·최대 계산이 사전순이 되어 선이 엉킨다
  const NUM = row => { for (const k in row) { const v = row[k]; if (v !== '' && v != null && /^-?\d+(\.\d+)?$/.test(v)) row[k] = +v; } return row; };
  for (const id in FILES) store[id] = {status: 'loading', data: null};
  const api = {
    colors: ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#8c564b', '#e377c2', '#17becf'],
    data(id){ return store[id] || {status: 'missing', data: null}; },
    calc(id, spec){ calcs[id] = spec; store[id] = {status: 'loading', data: null}; if (loaded) runCalc(id); },
    onData(cb){ cbs.push(cb); if (loaded) cb(); },
    async load(){
      const v = Date.now();
      await Promise.all(Object.keys(FILES).map(async id => {
        try { const r = await fetch('data/' + FILES[id] + '?v=' + v, {cache: 'no-store'}); if (!r.ok) throw new Error('HTTP ' + r.status);
          store[id] = {status: 'ok', data: d3.csvParse(await r.text(), NUM)}; }
        catch (e) { store[id] = {status: 'missing', data: null, error: String(e)}; }
      }));
      for (const id in calcs) runCalc(id);
      loaded = true; cbs.forEach(cb => { try { cb(); } catch (e) { console.error(e); } });
      const miss = Object.keys(store).filter(k => store[k].status === 'missing' && !(k in calcs));
      if (miss.length) { const d = document.createElement('div'); d.className = 'web-err'; d.textContent = '읽지 못한 자료: ' + miss.join(', '); document.getElementById('page').prepend(d); }
      try { const r = await fetch('meta.json?v=' + v, {cache: 'no-store'}); const m = await r.json();
        document.querySelector('#web-bar span').textContent = `웹판 · ${m.label} · 계산 ${m.run_at} KST · 코스피 ${m.kospi} · 금투협 ${m.kofia} · VKOSPI ${m.vkospi} 기준 · 자료 ${m.built_at}`; } catch (e) {}
    }
  };
  function runCalc(id){ const s = calcs[id]; const ins = s.inputs.map(k => store[k]);
    if (ins.every(x => x && x.status === 'ok')) { try { store[id] = {status: 'ok', data: s.fn(...ins.map(x => x.data))}; } catch (e) { store[id] = {status: 'error', data: null, error: String(e)}; } }
    else store[id] = {status: ins.some(x => !x || ['error','missing'].includes(x.status)) ? 'missing' : 'loading', data: null}; }
  return api;
})();
(async function(){
  const host = document.getElementById('page');
  try {
    const r = await fetch('page.html?v=' + Date.now(), {cache: 'no-store'}); if (!r.ok) throw new Error('HTTP ' + r.status);
    const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
    doc.querySelectorAll('style').forEach(s => document.head.appendChild(s.cloneNode(true)));
    const scripts = Array.from(doc.querySelectorAll('script')); scripts.forEach(s => s.remove());
    Array.from(doc.body.childNodes).forEach(n => host.appendChild(document.importNode(n, true)));
    for (const s of scripts) {   // 페이지 코드 실행(대시보드와 같은 코드). <script src="relief.js"> 처럼 따로 둔 파일은 같은 폴더에서 읽어 실행
      const e = document.createElement('script'); const src = s.getAttribute('src');
      if (src) { try { const rr = await fetch(src + '?v=' + Date.now(), {cache: 'no-store'}); if (!rr.ok) throw new Error('HTTP ' + rr.status); e.textContent = await rr.text(); } catch (err) { console.error('스크립트 못 읽음', src, err); continue; } }
      else e.textContent = s.textContent;
      document.body.appendChild(e);
    }
    await window.dash.load();
  } catch (e) { host.innerHTML = '<div class="web-err">페이지(page.html)를 읽지 못했습니다: ' + String(e).replace(/</g, '&lt;') + '</div>'; }
})();
</script>
</body>
</html>
